services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: booknest-backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - ./backend:/app
      - booknest_node_modules:/app/node_modules

  mysql:
    image: mysql:8.0
    container_name: booknest-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - booknest_mysql_data:/var/lib/mysql

volumes:
  booknest_node_modules:
  booknest_mysql_data: